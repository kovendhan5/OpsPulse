name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["gitops/**", "docs/**", "*.md"]
  pull_request:

permissions:
  id-token: write # OIDC to AWS
  contents: write # commit the new image tag back to Git

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: opspulse

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt
      - run: cd app && pytest -q

  build-scan-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # output github_ci_role_arn from Terraform
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA::7}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" app

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Update GitOps manifest with new tag
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA::7}/" gitops/apps/opspulse/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "chore: release ${GITHUB_SHA::7} [skip ci]"
          git push
