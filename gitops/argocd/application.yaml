apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspulse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kovendhan5/opspulse.git
    targetRevision: main
    path: gitops/apps/opspulse
  destination:
    server: https://kubernetes.default.svc
    namespace: opspulse
  syncPolicy:
    automated:
      prune: true     # remove things deleted from Git
      selfHeal: true  # undo manual changes (fights configuration drift)
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
