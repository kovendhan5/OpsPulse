apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opspulse
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: opspulse
  podTargetLabels:
    - rollouts-pod-template-hash # lets us measure the canary separately from the stable version
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
